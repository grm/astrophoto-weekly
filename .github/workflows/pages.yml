name: Publish AstroPhoto Weekly

on:
  push:
    branches: ["main"]
    paths:
      - "data/submissions/*.json"
      - "content/issues/**"
      - "data/site.json"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "scripts/discord.py"
      - "scripts/publish_submission.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-submission:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.publish.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect new submission
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" ]]; then exit 0; fi
          FILES="$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'data/submissions/*.json')"
          COUNT="$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$COUNT" -eq 0 ]]; then exit 0; fi
          if [[ "$COUNT" -ne 1 ]]; then echo "Expected one new submission" >&2; exit 1; fi
          echo "file=$FILES" >> "$GITHUB_OUTPUT"
      - name: Publish in one commit
        if: steps.detect.outputs.file != ''
        id: publish
        shell: bash
        env:
          SUBMISSION: ${{ steps.detect.outputs.file }}
        run: |
          set -euo pipefail
          python scripts/publish_submission.py "$SUBMISSION"
          SLUG="$(basename "$SUBMISSION" .json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "content/digests/$SLUG.md" data/editorial-history.json "content/issues/$SLUG.md"
          git commit -m "publish: AstroPhoto Weekly #$SLUG"
          git push origin HEAD:main
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: publish-submission
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    runs-on: ubuntu-latest
    needs: [publish-submission, deploy]
    if: github.event_name == 'push'
    environment: github-pages
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Detect published issue
        id: issue
        shell: bash
        env:
          STAGED_SLUG: ${{ needs.publish-submission.outputs.slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$STAGED_SLUG" ]]; then
            echo "slug=$STAGED_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'content/issues/*.md' || true)"
          COUNT="$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$COUNT" -eq 0 ]]; then exit 0; fi
          if [[ "$COUNT" -ne 1 ]]; then echo "Expected one new issue" >&2; exit 1; fi
          FILE="$(printf '%s\n' "$FILES" | head -n 1)"
          SLUG="$(basename "$FILE" .md)"
          [[ "$SLUG" =~ ^[0-9]{3}$ ]] || exit 1
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
      - name: Send Discord notification
        if: steps.issue.outputs.slug != ''
        env:
          ISSUE_SLUG: ${{ steps.issue.outputs.slug }}
        run: python scripts/discord.py
