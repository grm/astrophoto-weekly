name: Publish AstroPhoto Weekly

on:
  push:
    branches: ["main"]
    paths:
      - "data/submissions/*.json"
      - "data/specialists/submissions/**/*.json"
      - "data/specialists/series.json"
      - "content/issues/**"
      - "content/specialists/issues/**"
      - "data/site.json"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# A common deployment queue avoids deploying an older snapshot over a newer edition.
# Every run drains all pending submissions from current main, including coalesced events.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-submission:
    runs-on: ubuntu-latest
    outputs:
      has_pending: ${{ steps.publish.outputs.has_pending }}
      has_errors: ${{ steps.publish.outputs.has_errors }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Verify publication isolation and delivery routing
        run: python -m unittest discover -s tests -v
      - name: Prepare pending publications
        id: publish
        run: python scripts/process_submissions.py
      - name: Commit validated publications together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/issues content/digests content/specialists data/editorial-history.json data/specialists/*/editorial-history.json data/discord-outbox.json
          if ! git diff --cached --quiet; then
            git commit -m "publish: commit validated newsletter submissions"
            git push origin HEAD:main
          fi

  build:
    runs-on: ubuntu-latest
    needs: publish-submission
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    runs-on: ubuntu-latest
    needs: [publish-submission, deploy]
    if: needs.publish-submission.outputs.has_pending == 'true'
    environment: github-pages
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_PIXINSIGHT: ${{ secrets.DISCORD_WEBHOOK_PIXINSIGHT }}
      DISCORD_WEBHOOK_SIRIL: ${{ secrets.DISCORD_WEBHOOK_SIRIL }}
      DISCORD_WEBHOOK_NINA: ${{ secrets.DISCORD_WEBHOOK_NINA }}
      DISCORD_WEBHOOK_PHOTOSHOP_ASTRO: ${{ secrets.DISCORD_WEBHOOK_PHOTOSHOP_ASTRO }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      BATCH_FILE: /tmp/astrophoto-discord-batch.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reserve delivery attempts
        run: python scripts/discord_outbox.py reserve
      - name: Persist attempts before external delivery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discord-outbox.json
          if ! git diff --cached --quiet; then
            git commit -m "delivery: reserve Discord notification attempts"
            git push origin HEAD:main
          fi
      - name: Deliver and record Discord acknowledgements
        run: python scripts/discord_outbox.py send
      - name: Persist delivery results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add data/discord-outbox.json
          if ! git diff --cached --quiet; then
            git commit -m "delivery: record Discord notification results"
            git push origin HEAD:main
          fi

  editorial-status:
    runs-on: ubuntu-latest
    needs: [publish-submission, deploy]
    if: needs.publish-submission.outputs.has_errors == 'true'
    steps:
      - run: |
          echo "Some submissions were rejected. Valid editions were deployed; inspect validation warnings."
          exit 1
